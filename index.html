<script>
  // Framer Motion UMD global
  window.Motion = window.Motion || window.framerMotion;

  // Suppress one known false-positive: framer-motion v11's internal renderer
  // emits a "unique key" warning on its first motion-component mount.
  // We swallow ONLY the warning whose component stack originates in framer's
  // internal frame — genuine key warnings from our own code still surface.
  (function () {
    const orig = console.error;
    console.error = function (...args) {
      try {
        const msg = String(args[0] || '');
        const stack = String(args[1] || '') + String(args[2] || '');
        if (msg.includes('unique "key" prop') &&
            /at l \(\S*framer-motion/.test(stack)) return;
      } catch (e) {}
      return orig.apply(console, args);
    };
  })();
</script>
